# docker compose up --build
# Open http://localhost:8081/login

services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: kuet_ums
      POSTGRES_USER: kuet
      POSTGRES_PASSWORD: kuet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuet -d kuet_ums"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kuet_ums
      SPRING_DATASOURCE_USERNAME: kuet
      SPRING_DATASOURCE_PASSWORD: kuet
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
