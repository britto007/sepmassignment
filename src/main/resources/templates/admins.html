<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Admins')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>Admins</h1>
            <p>Admins can create, update, and delete admin accounts.</p>
        </div>
    </div>
    <p class="alert success" th:if="${success}" th:text="${success}">Saved.</p>
    <p class="alert error" th:if="${error}" th:text="${error}">Error.</p>
    <div class="layout">
        <section class="panel">
            <h2>New admin</h2>
            <p class="alert error" th:if="${formError != null and editingId == null}" th:text="${formError}">Error.</p>
            <form class="stack" th:action="@{/admins}" th:object="${createForm}" method="post">
                <label>
                    Full name
                    <input th:field="*{fullName}" required maxlength="120">
                    <p class="field-error" th:errors="*{fullName}"></p>
                </label>
                <label>
                    Email
                    <input type="email" th:field="*{email}" required maxlength="180">
                    <p class="field-error" th:errors="*{email}"></p>
                </label>
                <label>
                    Username
                    <input th:field="*{username}" required minlength="3" maxlength="50">
                    <p class="field-error" th:errors="*{username}"></p>
                </label>
                <label>
                    Password
                    <input type="password" th:field="*{password}" required minlength="6" maxlength="72" autocomplete="new-password">
                    <p class="hint">At least 6 characters.</p>
                    <p class="field-error" th:errors="*{password}"></p>
                </label>
                <button class="primary" type="submit">Create admin</button>
            </form>
        </section>
        <section class="panel">
            <div th:if="${editingId != null}">
                <h2 th:text="'Edit admin #' + ${editingId}">Edit admin</h2>
                <p class="alert error" th:if="${formError != null}" th:text="${formError}">Error.</p>
                <form class="stack" th:action="@{/admins/{id}(id=${editingId})}" th:object="${editForm}" method="post">
                    <label>
                        Full name
                        <input th:field="*{fullName}" required maxlength="120">
                        <p class="field-error" th:errors="*{fullName}"></p>
                    </label>
                    <label>
                        Email
                        <input type="email" th:field="*{email}" required maxlength="180">
                        <p class="field-error" th:errors="*{email}"></p>
                    </label>
                    <label>
                        Username
                        <input th:field="*{username}" required minlength="3" maxlength="50">
                        <p class="field-error" th:errors="*{username}"></p>
                    </label>
                    <label>
                        Password
                        <input type="password" th:field="*{password}" minlength="6" maxlength="72" autocomplete="new-password">
                        <p class="hint">Leave blank to keep the current password.</p>
                        <p class="field-error" th:errors="*{password}"></p>
                    </label>
                    <div class="actions">
                        <button class="primary" type="submit">Save changes</button>
                        <a class="button ghost" th:href="@{/admins}">Cancel</a>
                    </div>
                </form>
            </div>
            <h2>All admins</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(admins)}">
                        <td colspan="4">No admin accounts yet.</td>
                    </tr>
                    <tr th:each="admin : ${admins}">
                        <td th:text="${admin.fullName}">Name</td>
                        <td th:text="${admin.email}">Email</td>
                        <td th:text="${admin.username}">Username</td>
                        <td>
                            <div class="row-actions">
                                <a class="button ghost" th:href="@{/admins/{id}/edit(id=${admin.id})}">Edit</a>
                                <form th:if="${admin.username != #authentication.name}"
                                      th:action="@{/admins/{id}/delete(id=${admin.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this admin?')">
                                    <button class="danger" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
