<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: head('Students')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>Students</h1>
            <p>You can add a student and view every student. You can edit only your own account.</p>
        </div>
    </div>
    <p class="alert success" th:if="${success}" th:text="${success}">Saved.</p>
    <p class="alert error" th:if="${error}" th:text="${error}">Error.</p>
    <div class="layout">
        <section class="panel">
            <h2>New student</h2>
            <p class="alert error" th:if="${formError != null and editingId == null}" th:text="${formError}">Error.</p>
            <form class="stack" th:action="@{/students}" th:object="${createForm}" method="post">
                <label>
                    Full name
                    <input th:field="*{fullName}" required maxlength="120">
                    <p class="field-error" th:errors="*{fullName}"></p>
                </label>
                <label>
                    Email
                    <input type="email" th:field="*{email}" required maxlength="180">
                    <p class="field-error" th:errors="*{email}"></p>
                </label>
                <label>
                    Username
                    <input th:field="*{username}" required minlength="3" maxlength="50">
                    <p class="field-error" th:errors="*{username}"></p>
                </label>
                <label>
                    Student ID
                    <input th:field="*{studentId}" required maxlength="30">
                    <p class="field-error" th:errors="*{studentId}"></p>
                </label>
                <label>
                    Department
                    <input th:field="*{department}" required maxlength="100">
                    <p class="field-error" th:errors="*{department}"></p>
                </label>
                <label>
                    Batch
                    <input th:field="*{batch}" required maxlength="20">
                    <p class="field-error" th:errors="*{batch}"></p>
                </label>
                <label>
                    Password
                    <input type="password" th:field="*{password}" required minlength="6" maxlength="72" autocomplete="new-password">
                    <p class="hint">At least 6 characters.</p>
                    <p class="field-error" th:errors="*{password}"></p>
                </label>
                <button class="primary" type="submit">Create student</button>
            </form>
        </section>
        <section class="panel">
            <div th:if="${editingId != null}">
                <h2 th:text="'Edit student #' + ${editingId}">Edit student</h2>
                <p class="alert error" th:if="${formError != null}" th:text="${formError}">Error.</p>
                <form class="stack" th:action="@{/students/{id}(id=${editingId})}" th:object="${editForm}" method="post">
                    <label>
                        Full name
                        <input th:field="*{fullName}" required maxlength="120">
                        <p class="field-error" th:errors="*{fullName}"></p>
                    </label>
                    <label>
                        Email
                        <input type="email" th:field="*{email}" required maxlength="180">
                        <p class="field-error" th:errors="*{email}"></p>
                    </label>
                    <label>
                        Username
                        <input th:field="*{username}" required minlength="3" maxlength="50">
                        <p class="field-error" th:errors="*{username}"></p>
                    </label>
                    <label>
                        Student ID
                        <input th:field="*{studentId}" required maxlength="30">
                        <p class="field-error" th:errors="*{studentId}"></p>
                    </label>
                    <label>
                        Department
                        <input th:field="*{department}" required maxlength="100">
                        <p class="field-error" th:errors="*{department}"></p>
                    </label>
                    <label>
                        Batch
                        <input th:field="*{batch}" required maxlength="20">
                        <p class="field-error" th:errors="*{batch}"></p>
                    </label>
                    <label>
                        Password
                        <input type="password" th:field="*{password}" minlength="6" maxlength="72" autocomplete="new-password">
                        <p class="hint">Leave blank to keep the current password.</p>
                        <p class="field-error" th:errors="*{password}"></p>
                    </label>
                    <div class="actions">
                        <button class="primary" type="submit">Save changes</button>
                        <a class="button ghost" th:href="@{/students}">Cancel</a>
                    </div>
                </form>
            </div>
            <h2>All students</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Username</th>
                        <th>Student ID</th>
                        <th>Department</th>
                        <th>Batch</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7">No student accounts yet.</td>
                    </tr>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.fullName}">Name</td>
                        <td th:text="${student.email}">Email</td>
                        <td th:text="${student.username}">Username</td>
                        <td th:text="${student.studentId}">ID</td>
                        <td th:text="${student.department}">Department</td>
                        <td th:text="${student.batch}">Batch</td>
                        <td>
                            <div class="row-actions">
                                <a class="button ghost"
                                   th:if="${#authorization.expression('hasRole(''ADMIN'')') or student.username == #authentication.name}"
                                   th:href="@{/students/{id}/edit(id=${student.id})}">Edit</a>
                                <form sec:authorize="hasRole('ADMIN')"
                                      th:if="${student.username != #authentication.name}"
                                      th:action="@{/students/{id}/delete(id=${student.id})}"
                                      method="post"
                                      onsubmit="return confirm('Delete this student?')">
                                    <button class="danger" type="submit">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
